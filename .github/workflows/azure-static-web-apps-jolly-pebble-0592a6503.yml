name: Azure Static Web Apps Manual Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-static-site
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and build production artifact
        run: npm run build
      - name: Record deployed artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-site-${{ github.sha }}
          path: dist/
          retention-days: 14
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_PEBBLE_0592A6503 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # Exact validated static artifact
          skip_app_build: true
          api_location: "api" # Api source code path
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
